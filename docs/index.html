<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUX</title>
<style>
  :root { --bg: #F8F6F1; --fg: #1F231F; --muted: #686C65; --accent: #BC4F2F; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141613; --fg: #ECEAE4; --muted: #A2A59D; --accent: #E37752; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem max(1rem, env(safe-area-inset-left)) 4rem; }
  .brand { font-weight: 900; letter-spacing: .35em; font-size: .9rem; }
  h1 { font-size: 2rem; line-height: 1.15; margin: .75rem 0 .5rem; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand">AUX</div>
  <h1>Rank songs head-to-head.</h1>
  <p>AUX is an iOS app for ranking music and comparing taste with friends, built as a capstone project at California State University, Fullerton.</p>
  <p><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Use</a> · <a href="mailto:auxappmobile@gmail.com">auxappmobile@gmail.com</a></p>
</main>
</body>
</html>
